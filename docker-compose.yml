services:
  dev:
    build: .
    container_name: jubileu-dev
    stdin_open: true
    tty: true
    working_dir: /workspace
    volumes:
      - .:/workspace
      # Persist node_modules inside container (avoid host/container conflicts)
      - novob2b_modules:/workspace/novob2b/node_modules
      - deliverytest_modules:/workspace/deliverytest/node_modules
    ports:
      - "5173:5173"   # novob2b dev server
      - "5174:5174"   # deliverytest dev server
      - "3000:3000"   # deliverytest server.js
    environment:
      - NODE_ENV=development
    restart: unless-stopped

volumes:
  novob2b_modules:
  deliverytest_modules:
